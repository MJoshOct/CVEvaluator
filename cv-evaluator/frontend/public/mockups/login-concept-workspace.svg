<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">CV Evaluator login concept: workspace split layout</title>
  <desc id="desc">A polished sign-in screen with resume analysis preview and a simple login card.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f8f9fd"/><stop offset="1" stop-color="#eef0ff"/></linearGradient><linearGradient id="brand" x2="1" y2="1"><stop stop-color="#5148ca"/><stop offset="1" stop-color="#8176ed"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#29365b" flood-opacity=".12"/></filter></defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect x="205" y="78" width="1030" height="744" rx="27" fill="#fff" opacity=".35"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="160" y="146" width="44" height="44" rx="13" fill="url(#brand)"/><text x="182" y="175" fill="white" font-size="16" font-weight="800" text-anchor="middle">CV</text><text x="219" y="174" fill="#46516b" font-size="13" font-weight="800" letter-spacing="2">CV EVALUATOR</text>
    <text x="160" y="285" fill="#685de0" font-size="11" font-weight="800" letter-spacing="2">YOUR NEXT MOVE STARTS HERE</text><text x="160" y="348" fill="#202b45" font-size="48" font-weight="750" letter-spacing="-2">Make your experience</text><text x="160" y="402" fill="#202b45" font-size="48" font-weight="750" letter-spacing="-2">stand out.</text><text x="160" y="444" fill="#78839a" font-size="16">Turn your resume into a clear plan for your next opportunity</text><text x="160" y="469" fill="#78839a" font-size="16">with focused, practical feedback.</text>
    <g filter="url(#shadow)"><rect x="159" y="514" width="438" height="214" rx="18" fill="#fff" stroke="#e8eaf2"/></g>
    <rect x="178" y="532" width="38" height="38" rx="11" fill="#f0efff"/><path d="M192 542h10l5 5v14h-15z" fill="none" stroke="#6559df" stroke-width="1.6"/><path d="M202 542v6h5" fill="none" stroke="#6559df" stroke-width="1.6"/><text x="229" y="550" fill="#34405a" font-size="12" font-weight="700">Resume overview</text><text x="229" y="566" fill="#929bad" font-size="10">Ready for review</text><rect x="517" y="541" width="62" height="20" rx="10" fill="#e9f7f1"/><circle cx="529" cy="551" r="3" fill="#1b9c77"/><text x="537" y="554" fill="#138668" font-size="9" font-weight="700">Ready</text><path d="M178 583h400" stroke="#eff0f5"/>
    <circle cx="210" cy="624" r="28" fill="none" stroke="#eeedfc" stroke-width="6"/><path d="M210 596a28 28 0 0 1 26 39" fill="none" stroke="#7568e8" stroke-width="6" stroke-linecap="round"/><text x="210" y="628" fill="#5148c6" font-size="17" font-weight="800" text-anchor="middle">86</text><text x="250" y="617" fill="#35415b" font-size="11" font-weight="700">Strong foundation</text><text x="250" y="634" fill="#8993a8" font-size="9">Your experience is coming through clearly.</text>
    <text x="180" y="671" fill="#8a94a8" font-size="9">Experience</text><text x="316" y="671" fill="#8a94a8" font-size="9">Skills match</text><text x="453" y="671" fill="#8a94a8" font-size="9">ATS readiness</text><rect x="180" y="681" width="112" height="5" rx="3" fill="#eff0f6"/><rect x="180" y="681" width="96" height="5" rx="3" fill="#776be8"/><rect x="316" y="681" width="112" height="5" rx="3" fill="#eff0f6"/><rect x="316" y="681" width="83" height="5" rx="3" fill="#776be8"/><rect x="453" y="681" width="112" height="5" rx="3" fill="#eff0f6"/><rect x="453" y="681" width="103" height="5" rx="3" fill="#776be8"/>
    <path d="M160 775h18" stroke="#7d73e9" stroke-width="2"/><text x="186" y="779" fill="#8a94a8" font-size="10">Your account and resume stay private.</text>
    <g filter="url(#shadow)"><rect x="698" y="133" width="430" height="635" rx="22" fill="#fff" stroke="#e8eaf1"/></g>
    <rect x="735" y="167" width="356" height="44" rx="10" fill="#f3f4f9"/><rect x="739" y="171" width="174" height="36" rx="8" fill="#fff"/><text x="826" y="194" fill="#554bcf" font-size="12" font-weight="700" text-anchor="middle">Sign in</text><text x="1000" y="194" fill="#778199" font-size="12" font-weight="600" text-anchor="middle">Create account</text>
    <text x="735" y="269" fill="#26314b" font-size="24" font-weight="750">Welcome back</text><text x="735" y="293" fill="#8993a7" font-size="12">Sign in to continue to your workspace.</text>
    <text x="735" y="339" fill="#3d4860" font-size="11" font-weight="700">Username or Email</text><rect x="735" y="350" width="356" height="47" rx="9" fill="#fcfcfe" stroke="#e2e6ef"/><circle cx="754" cy="369" r="5" fill="none" stroke="#9ba4b5" stroke-width="1.4"/><path d="M745 386c1-8 17-8 18 0" fill="none" stroke="#9ba4b5" stroke-width="1.4"/><text x="774" y="379" fill="#a6adbb" font-size="12">Enter your username or email</text>
    <text x="735" y="433" fill="#3d4860" font-size="11" font-weight="700">Password</text><text x="1091" y="433" fill="#6257dc" font-size="10" font-weight="700" text-anchor="end">Forgot password?</text><rect x="735" y="444" width="356" height="47" rx="9" fill="#fcfcfe" stroke="#e2e6ef"/><rect x="750" y="459" width="11" height="11" rx="2" fill="none" stroke="#9ba4b5" stroke-width="1.4"/><path d="M752 459v-3a4 4 0 0 1 8 0v3" fill="none" stroke="#9ba4b5" stroke-width="1.4"/><text x="774" y="473" fill="#a6adbb" font-size="12">Enter your password</text><text x="1064" y="473" fill="#949eb0" font-size="12">Show</text>
    <rect x="735" y="516" width="356" height="47" rx="9" fill="url(#brand)"/><text x="913" y="545" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Sign in to your account</text><text x="913" y="594" fill="#737e94" font-size="10" font-weight="600" text-anchor="middle">›  Use a demo account</text><path d="M735 625h105m146 0h105" stroke="#e6e8ef"/><text x="913" y="629" fill="#9aa2b2" font-size="9" letter-spacing="1" text-anchor="middle">OR CONTINUE WITH</text><rect x="735" y="648" width="356" height="46" rx="9" fill="#fff" stroke="#e1e5ed"/><circle cx="875" cy="671" r="8" fill="#fff" stroke="#d4d8e2"/><path d="M875 663a8 8 0 0 1 7 4h-4a4 4 0 0 0-3-1" fill="#4285f4"/><text x="891" y="675" fill="#374151" font-size="12" font-weight="600">Sign in with Google</text><text x="913" y="734" fill="#9aa2b2" font-size="9" text-anchor="middle">Secure sign in · Your data stays yours</text>
  </g>
</svg>
