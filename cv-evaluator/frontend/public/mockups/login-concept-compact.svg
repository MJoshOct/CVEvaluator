<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">CV Evaluator login concept: centered panel</title>
  <desc id="desc">A minimal centered login page with a deep violet banner and a calm, spacious sign-in form.</desc>
  <defs><linearGradient id="wash" x2=".9" y2="1"><stop stop-color="#f7f8fd"/><stop offset="1" stop-color="#eceeff"/></linearGradient><linearGradient id="violet" x2="1"><stop stop-color="#4841b8"/><stop offset="1" stop-color="#7267e2"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="15" stdDeviation="22" flood-color="#29365b" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="800" fill="url(#wash)"/>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="360" y="86" width="480" height="630" rx="24" fill="#fff" filter="url(#shadow)"/>
    <path d="M384 86h432a24 24 0 0 1 24 24v175H360V110a24 24 0 0 1 24-24z" fill="url(#violet)"/>
    <circle cx="777" cy="126" r="90" fill="#fff" opacity=".05"/><circle cx="735" cy="225" r="115" fill="none" stroke="#fff" stroke-opacity=".12"/>
    <rect x="399" y="119" width="40" height="40" rx="12" fill="#fff" opacity=".16"/><text x="419" y="145" fill="#fff" font-size="14" font-weight="800" text-anchor="middle">CV</text><text x="451" y="145" fill="#fff" font-size="12" font-weight="800" letter-spacing="1.4">CV EVALUATOR</text>
    <text x="399" y="203" fill="#fff" font-size="29" font-weight="750" letter-spacing="-.7">Good to see you again.</text><text x="399" y="228" fill="#e7e5ff" font-size="12">Your next opportunity is one thoughtful step away.</text>
    <rect x="397" y="288" width="406" height="42" rx="10" fill="#f2f3f8"/><rect x="401" y="292" width="198" height="34" rx="7" fill="#fff"/><text x="500" y="314" fill="#554bcf" font-size="11" font-weight="700" text-anchor="middle">Sign in</text><text x="701" y="314" fill="#7d879b" font-size="11" font-weight="600" text-anchor="middle">Create account</text>
    <text x="397" y="376" fill="#34405a" font-size="11" font-weight="700">Email or username</text><rect x="397" y="387" width="406" height="47" rx="9" fill="#fff" stroke="#e0e4ed"/><text x="417" y="416" fill="#a5adba" font-size="12">you@example.com</text>
    <text x="397" y="469" fill="#34405a" font-size="11" font-weight="700">Password</text><text x="803" y="469" fill="#6257dc" font-size="10" font-weight="700" text-anchor="end">Forgot password?</text><rect x="397" y="480" width="406" height="47" rx="9" fill="#fff" stroke="#e0e4ed"/><text x="417" y="509" fill="#a5adba" font-size="12">Your password</text>
    <rect x="397" y="552" width="406" height="48" rx="9" fill="url(#violet)"/><text x="600" y="581" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Continue to workspace</text>
    <path d="M397 625h129m148 0h129" stroke="#e4e7ee"/><text x="600" y="629" fill="#9aa2b2" font-size="9" letter-spacing="1" text-anchor="middle">OR CONTINUE WITH</text><rect x="397" y="649" width="406" height="44" rx="9" fill="#fff" stroke="#e0e4ed"/><circle cx="532" cy="671" r="8" fill="none" stroke="#4285f4" stroke-width="2"/><text x="550" y="675" fill="#374151" font-size="12" font-weight="600">Sign in with Google</text>
  </g>
</svg>
